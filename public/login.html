<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в кабинет | ЭнергоАтлант</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="login-container">
        <form class="login-form">
            <h2>Портал заказчика</h2>
            <p>Введите данные для доступа к объектам</p>
            
            <div class="input-group">
                <input type="text" id="username" placeholder="Логин / Email / Телефон">
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Пароль">
            </div>

            <a href="#" style="font-size: 0.8rem; color: #ff9800; float: right; margin-bottom: 15px;" onclick="alert('Обратитесь к администратору для сброса')">Забыли пароль?</a>
            
            <button type="button" id="loginBtn" class="btn-login-submit">Войти в кабинет</button>
            
            <div class="register-link-box">
                <p>Нет аккаунта?</p>
                <a href="register.html" class="btn-register">Стать партнером</a>
            </div>

            <a href="index.html" class="back-link">← На главную</a>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>

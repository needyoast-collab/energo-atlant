<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - ЭнергоАтлант</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="text-primary">⚡ ЭнергоАтлант</h2>
                            <p class="text-muted">Вход в систему</p>
                        </div>

                        <div id="alertBox" class="alert alert-danger d-none"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="login" class="form-label">Логин, email или телефон</label>
                                <input type="text" class="form-control form-control-lg" id="login" 
                                       placeholder="Введите логин" required autofocus autocomplete="username">
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Пароль</label>
                                <input type="password" class="form-control form-control-lg" id="password" 
                                       placeholder="Введите пароль" required autocomplete="current-password">
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" id="submitBtn">
                                Войти
                            </button>

                            <div class="text-center">
                                <p class="mb-0">
                                    Нет аккаунта? 
                                    <a href="/register.html" class="text-primary">Зарегистрироваться</a>
                                </p>
                            </div>
                        </form>

                        <hr class="my-4">

                        <div class="text-center">
                            <small class="text-muted">
                                Тестовые данные:<br>
                                <strong>admin</strong> / <strong>admin123</strong>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            // 1. ОТМЕНЯЕМ ПЕРЕЗАГРУЗКУ (Убирает моргание)
            e.preventDefault();
            
            const loginInput = document.getElementById('login');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');
            
            // Сбрасываем старые ошибки
            alertBox.classList.add('d-none');
            alertBox.innerText = '';
            
            const login = loginInput.value.trim();
            const password = passwordInput.value.trim();
            
            // Валидация на пустоту
            if (!login || !password) {
                showAlert('Заполните все поля');
                return;
            }
            
            // 2. БЛОКИРУЕМ КНОПКУ (Показываем, что идет загрузка)
            submitBtn.disabled = true;
            const originalText = submitBtn.innerText;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Вход...';
            
            try {
                // 3. ОТПРАВЛЯЕМ ЗАПРОС
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });

                const data = await response.json();

                if (data.success) {
                    // УСПЕХ: Показываем зеленое сообщение и переходим
                    alertBox.className = 'alert alert-success';
                    alertBox.innerText = 'Вход выполнен! Перенаправление...';
                    alertBox.classList.remove('d-none');
                    
                    setTimeout(() => {
                        // Перенаправление в зависимости от роли
                        if (data.role === 'admin') window.location.href = '/dashboard_manager.html';
                        else if (data.role === 'manager') window.location.href = '/dashboard_manager.html';
                        else if (data.role === 'foreman') window.location.href = '/dashboard_foreman.html';
                        else if (data.role === 'supplier') window.location.href = '/dashboard_supplier.html';
                        else if (data.role === 'pto') window.location.href = '/dashboard_pto.html';
                        else window.location.href = '/dashboard_customer.html';
                    }, 500);
                } else {
                    // ОШИБКА СЕРВЕРА (например, неверный пароль)
                    throw new Error(data.message || 'Ошибка входа');
                }
            } catch (error) {
                console.error(error);
                // 4. ЕСЛИ ОШИБКА - ВОЗВРАЩАЕМ КНОПКУ (Убирает вечное зависание)
                showAlert(error.message || 'Ошибка соединения с сервером');
                submitBtn.disabled = false;
                submitBtn.innerText = originalText;
            }
        });

        // Функция для показа красной ошибки
        function showAlert(message) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = 'alert alert-danger';
            alertBox.innerText = message;
            alertBox.classList.remove('d-none');
        }
    </script>
</body>
</html>

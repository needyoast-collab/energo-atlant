<!DOCTYPE html>
<html lang="ru" style="background-color:#050505;color-scheme:dark">


<head>
    <style>/* critical-dark-bg */html,body{background-color:#050505 !important;color-scheme:dark}</style>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <meta name="theme-color" content="#050505">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - ЭнергоАтлант</title>
    <!-- Подключаем Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Иконки Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Наши кастомные премиум стили -->
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/spa.css" rel="stylesheet">    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(10, 10, 10, 0.9), rgba(10, 10, 10, 0.95)), url('https://images.unsplash.com/photo-1541888086026-6f8c2b73ee34?q=80&w=2669&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        .back-button {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 50;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        .back-button:hover {
            color: var(--primary-color);
            transform: translateX(-5px);
        }

        .brand-logo {
            font-size: 2.5rem;
            color: var(--text-main);
            font-weight: 900;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .brand-logo span {
            color: var(--text-muted);
        }

        .login-panel {
            width: 100%;
            max-width: 440px;
            padding: 3rem 2.5rem;
            position: relative;
            z-index: 10;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
        }
    </style>
    
</head>

<body>
    <!-- Кнопка назад -->
    <a href="/index.html" class="back-button">
        <i class="bi bi-arrow-left"></i> НА ГЛАВНУЮ
    </a>

    <div class="login-container">
        <!-- Главная карточка (Brutalist) -->
        <div class="login-panel" data-aos="zoom-in" data-aos-duration="600">
            <div class="text-center mb-5 border-bottom pb-4" style="border-color: var(--border-color) !important;">
                <div class="brand-logo mb-2">ЭНЕРГО<span>АТЛАНТ</span></div>
                <p class="text-muted text-uppercase" style="font-size: 0.8rem; letter-spacing: 0.1em;">Система
                    управления</p>
            </div>

            <div id="alertBox" class="alert d-none mb-4 rounded-0" style="border-radius: 0;"></div>

            <form id="loginForm">
                <!-- Логин (Плавающий Label) -->
                <div class="form-floating mb-4">
                    <input type="text" class="form-control rounded-0" id="login" placeholder=" " required autofocus
                        autocomplete="username">
                    <label for="login"><i class="bi bi-person me-2"></i>Логин / Телефон</label>
                </div>

                <!-- Пароль (Плавающий Label) -->
                <div class="form-floating mb-4">
                    <input type="password" class="form-control rounded-0" id="password" placeholder=" " required
                        autocomplete="current-password">
                    <label for="password"><i class="bi bi-lock me-2"></i>Пароль</label>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input rounded-0" type="checkbox" id="rememberMe"
                            style="background-color: transparent; border-color: var(--border-color);">
                        <label class="form-check-label text-muted" for="rememberMe" style="font-size: 0.85rem;">
                            Запомнить меня
                        </label>
                    </div>
                    <a href="#" id="forgotPasswordLink" class="text-white text-decoration-none small transition"
                        style="font-size: 0.85rem;">Забыли пароль?</a>
                </div>

                <button type="submit"
                    class="btn btn-primary btn-lg w-100 mb-4 py-3 fw-bold border-0 rounded-0 text-uppercase"
                    id="submitBtn">
                    ВОЙТИ В СИСТЕМУ
                </button>

                <div class="text-center border-top pt-4" style="border-color: var(--border-color) !important;">
                    <p class="text-muted mb-0 text-uppercase" style="font-size: 0.8rem; letter-spacing: 0.05em;">
                        Нет аккаунта?
                        <a href="/register.html"
                            class="text-white fw-bold text-decoration-none border-bottom px-1 ms-1">СОЗДАТЬ</a>
                    </p>
                </div>
            </form>


        </div>
    </div>

    <!-- Модальное окно восстановления пароля -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="forgotPasswordModalLabel">Восстановление пароля</h5>
                    <button type="button" id="closeModalBtn" class="btn-close btn-close-white"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-3">Введите ваш email для восстановления пароля. Мы отправим вам инструкции по
                        восстановлению доступа.</p>

                    <form id="forgotPasswordForm">
                        <div class="mb-3">
                            <label for="resetEmail" class="form-label">Email адрес</label>
                            <input type="email" class="form-control bg-dark text-white border-secondary" id="resetEmail"
                                placeholder="your@email.com" required>
                            <small class="text-muted">Укажите email, который вы использовали при регистрации</small>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary" id="sendResetBtn">
                                📧 Отправить инструкции
                            </button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                Отмена
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Init AOS
        AOS.init({ once: true });

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const loginInput = document.getElementById('login');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');

            alertBox.classList.add('d-none');
            alertBox.innerText = '';

            const login = loginInput.value.trim();
            const password = passwordInput.value.trim();

            if (!login || !password) {
                showAlert('Заполните все поля', 'warning');
                return;
            }

            submitBtn.disabled = true;
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Авторизация...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });

                const data = await response.json();

                if (data.success) {
                    alertBox.className = 'alert alert-success d-flex align-items-center gap-2';
                    alertBox.innerHTML = '<i class="bi bi-check-circle-fill"></i> Вход выполнен! Перенаправление...';
                    alertBox.classList.remove('d-none');

                    submitBtn.classList.remove('btn-primary');
                    submitBtn.classList.add('btn-success');
                    submitBtn.innerHTML = '<i class="bi bi-check2"></i> Успешно';

                    setTimeout(() => {
                        window.location.replace('/dashboard');
                    }, 800);
                } else {
                    throw new Error(data.message || 'Ошибка входа');
                }
            } catch (error) {
                console.error(error);
                showAlert(error.message || 'Ошибка соединения с сервером', 'danger');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;

                // Эффект тряски при ошибке
                const panel = document.querySelector('.glass-panel');
                panel.style.transform = 'translateX(-10px)';
                setTimeout(() => panel.style.transform = 'translateX(10px)', 100);
                setTimeout(() => panel.style.transform = 'translateX(-10px)', 200);
                setTimeout(() => panel.style.transform = 'translateX(10px)', 300);
                setTimeout(() => panel.style.transform = 'translateX(0)', 400);
            }
        });

        function showAlert(message, type = 'danger') {
            const alertBox = document.getElementById('alertBox');
            const icon = type === 'danger' ? 'bi-exclamation-triangle-fill' : 'bi-info-circle-fill';
            alertBox.className = `alert alert-${type} d-flex align-items-center gap-2 border-0 bg-${type} bg-opacity-25 text-white`;
            alertBox.innerHTML = `<i class="bi ${icon}"></i> ${message}`;
            alertBox.classList.remove('d-none');
        }

        // Обработчик для "Забыли пароль"
        // Обработчик для "Забыли пароль"
        document.addEventListener('DOMContentLoaded', () => {
            const forgotPasswordLink = document.getElementById('forgotPasswordLink');

            if (forgotPasswordLink) {
                forgotPasswordLink.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (typeof bootstrap === 'undefined') {
                        showAlert('Модуль временно недоступен', 'warning');
                        return;
                    }

                    const modalElement = document.getElementById('forgotPasswordModal');
                    if (modalElement) {
                        const modal = new bootstrap.Modal(modalElement);
                        modal.show();
                    }
                });
            }

            // Обработка отправки формы восстановления
            const forgotPasswordForm = document.getElementById('forgotPasswordForm');
            if (forgotPasswordForm) {
                forgotPasswordForm.addEventListener('submit', async function (e) {
                    e.preventDefault();
                    const email = document.getElementById('resetEmail').value.trim();
                    const sendBtn = document.getElementById('sendResetBtn');

                    if (!email) {
                        showAlert('Введите email', 'warning');
                        return;
                    }

                    sendBtn.disabled = true;
                    sendBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Отправка...';

                    try {
                        const response = await fetch('/api/public/request', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                fullName: "Восстановление пароля",
                                phone: "+70000000000",
                                email: email,
                                description: "Запрос на восстановление пароля: " + email
                            })
                        });

                        const data = await response.json();

                        if (response.ok) {
                            showAlert('Инструкции отправлены на ваш email', 'success');
                            const modal = bootstrap.Modal.getInstance(document.getElementById('forgotPasswordModal'));
                            if (modal) modal.hide();
                            forgotPasswordForm.reset();
                        } else {
                            showAlert(data.message || 'Ошибка', 'danger');
                        }
                    } catch (err) {
                        showAlert('Сетевая ошибка', 'danger');
                    } finally {
                        sendBtn.disabled = false;
                        sendBtn.innerHTML = '📧 Отправить инструкции';
                    }
                });
            }
        });
    </script>
</body>

</html>

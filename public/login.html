<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - ЭнергоАтлант</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="text-primary">⚡ ЭнергоАтлант</h2>
                            <p class="text-muted">Вход в систему</p>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="login" class="form-label">Логин, email или телефон</label>
                                <input type="text" class="form-control form-control-lg" id="login" 
                                       placeholder="Введите логин" required autofocus>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Пароль</label>
                                <input type="password" class="form-control form-control-lg" id="password" 
                                       placeholder="Введите пароль" required>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">
                                    Запомнить меня
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                                Войти
                            </button>

                            <div class="text-center">
                                <p class="mb-0">
                                    Нет аккаунта? 
                                    <a href="/register.html" class="text-primary">Зарегистрироваться</a>
                                </p>
                            </div>
                        </form>

                        <hr class="my-4">

                        <div class="text-center">
                            <small class="text-muted">
                                Тестовые учетные данные:<br>
                                <strong>admin</strong> / <strong>admin123</strong>
                            </small>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <a href="/" class="text-muted">← Вернуться на главную</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
        // Обработчик формы входа
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value;
            
            if (!login || !password) {
                showError('Заполните все поля');
                return;
            }
            
            // Блокируем кнопку
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Вход...';
            
            try {
                const data = await apiRequest('/api/login', 'POST', { login, password });
                
                if (data.success) {
                    showSuccess('Вход выполнен! Перенаправление...');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    showError(data.message || 'Неверный логин или пароль');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Войти';
                }
            } catch (error) {
                showError('Ошибка соединения с сервером');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Войти';
            }
        });
    </script>
</body>
</html>

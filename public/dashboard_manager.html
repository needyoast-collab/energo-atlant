<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель Менеджера | ЭнергоАтлант</title>
    <link rel="stylesheet" href="css/style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Специфичные стили для админки */
        body { background: #0d1117; color: #e6edf3; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar {
            width: 260px;
            background: #161b22;
            border-right: 1px solid #30363d;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar h2 { color: #ff9800; font-size: 1.2rem; margin-bottom: 30px; text-align: center; }
        
        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: #8b949e;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 5px;
            transition: 0.2s;
            cursor: pointer;
        }
        .menu-item:hover, .menu-item.active { background: rgba(255,152,0, 0.1); color: #ff9800; }
        .menu-item i { margin-right: 10px; width: 20px; text-align: center; }
        
        .logout-btn {
            margin-top: auto;
            color: #ff6b6b;
            border: 1px solid rgba(255,107,107, 0.3);
            text-align: center;
            justify-content: center;
        }
        .logout-btn:hover { background: #ff6b6b; color: white; }

        .content { flex: 1; padding: 30px; overflow-y: auto; }
        
        .card {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
        }
        
        /* Таблицы и формы */
        input, select { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 15px; 
            background: #0d1117; 
            border: 1px solid #30363d; 
            color: white; 
            border-radius: 5px; 
            box-sizing: border-box;
        }
        .btn-submit {
            background: #ff9800; color: white; border: none; padding: 12px 20px; 
            border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; color: #8b949e; padding: 10px; border-bottom: 1px solid #30363d; }
        td { padding: 12px 10px; border-bottom: 1px solid #30363d; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>ЭНЕРГО<span>АТЛАНТ</span></h2>
        
        <a href="#" class="menu-item active" onclick="showSection('create')">
            <i class="fas fa-plus-circle"></i> Новый проект
        </a>
        <a href="#" class="menu-item" onclick="showSection('list')">
            <i class="fas fa-list"></i> Список проектов
        </a>
        <a href="index.html" class="menu-item">
            <i class="fas fa-home"></i> На сайт
        </a>

        <a href="/api/logout" class="menu-item logout-btn">
            <i class="fas fa-sign-out-alt"></i> Выход
        </a>
    </aside>

    <main class="content">
        <h1>Кабинет Менеджера</h1>

        <div id="section-create" class="card">
            <h3 style="margin-top:0; color:#ff9800"><i class="fas fa-hard-hat"></i> Запуск нового объекта</h3>
            <form id="createProjectForm">
                <label>Название проекта</label>
                <input type="text" id="p_title" placeholder="Пример: Реконструкция ПС-500" required>
                
                <label>Адрес</label>
                <input type="text" id="p_addr" placeholder="г. Москва, ул..." required>
                
                <label>Ссылка на документацию (Облако)</label>
                <input type="text" id="p_doc" placeholder="https://disk.yandex.ru/...">
                
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                    <div>
                        <label>Назначить Прораба</label>
                        <select id="sel_foreman"><option value="">-- Выберите --</option></select>
                    </div>
                    <div>
                        <label>Назначить Снабженца</label>
                        <select id="sel_supplier"><option value="">-- Выберите --</option></select>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Создать проект и получить Код</button>
            </form>
        </div>

        <div id="section-list" class="card">
            <h3 style="margin-top:0; color:#ff9800"><i class="fas fa-tasks"></i> Активные проекты</h3>
            <table id="proj_table">
                </table>
        </div>
    </main>

    <script>
        // Переключение вкладок (Простая логика для удобства)
        function showSection(name) {
            // Можно скроллить к секции
            if(name === 'create') document.getElementById('section-create').scrollIntoView({behavior: 'smooth'});
            if(name === 'list') document.getElementById('section-list').scrollIntoView({behavior: 'smooth'});
        }

        async function init() {
            try {
                // Грузим список сотрудников
                const sRes = await fetch('/api/staff');
                const sData = await sRes.json();
                
                if(sData.success) {
                    const fSel = document.getElementById('sel_foreman');
                    const sSel = document.getElementById('sel_supplier');
                    
                    sData.staff.forEach(u => {
                        const opt = `<option value="${u.id}">${u.full_name}</option>`;
                        if(u.role === 'foreman') fSel.innerHTML += opt;
                        if(u.role === 'supplier') sSel.innerHTML += opt;
                    });
                }
                loadProjects();
            } catch(e) { console.error(e); }
        }

        async function loadProjects() {
            const res = await fetch('/api/manager/projects');
            const data = await res.json();
            const table = document.getElementById('proj_table');
            
            if(data.projects.length === 0) {
                table.innerHTML = "<p style='padding:10px; color:#777'>Проектов пока нет</p>";
                return;
            }

            table.innerHTML = `<tr><th>Название</th><th>Прораб</th><th>КОД ДОСТУПА</th><th>Статус</th></tr>` + 
                data.projects.map(p => `
                    <tr>
                        <td><b>${p.title}</b><br><small style="color:#888">${p.address}</small></td>
                        <td>${p.foreman_name || '<span style="color:#555">Не назначен</span>'}</td>
                        <td style="color:#ff9800; font-family:monospace; font-size:1.1em; letter-spacing:1px;">${p.access_code}</td>
                        <td>${p.status}</td>
                    </tr>
                `).join('');
        }

        document.getElementById('createProjectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                title: document.getElementById('p_title').value,
                address: document.getElementById('p_addr').value,
                doc_link: document.getElementById('p_doc').value,
                foreman_id: document.getElementById('sel_foreman').value,
                supplier_id: document.getElementById('sel_supplier').value
            };

            const res = await fetch('/api/projects/create', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const json = await res.json();

            if(json.success) {
                alert('✅ Проект создан!\n\nКод для Заказчика: ' + json.code);
                loadProjects();
            } else {
                alert('Ошибка: ' + json.message);
            }
        });

        init();
    </script>
</body>
</html>

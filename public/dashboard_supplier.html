<!DOCTYPE html>
<html lang="ru" style="background-color:#050505;color-scheme:dark">


<head>
    <style>/* critical-dark-bg */html,body{background-color:#050505 !important;color-scheme:dark}</style>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <meta name="theme-color" content="#050505">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Снабжение | ЭнергоАтлант</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/spa.css" rel="stylesheet">    <script>/* page-transition-script */document.documentElement.style.opacity="0";document.documentElement.style.transition="opacity 0.2s ease";window.addEventListener("load",function(){document.documentElement.style.opacity="1";});</script>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="/">
                <img src="/img/logo.png" alt="ЭнергоАтлант" style="height: 40px; object-fit: contain;" class="me-2">
                <span class="badge bg-info text-dark ms-1 align-middle d-none d-sm-inline"
                    style="font-size: 0.75rem; letter-spacing: 1px; padding: 0.4em 0.6em;">СНАБЖЕНИЕ</span>
            </a>

            <div class="d-flex align-items-center gap-2">
                <!-- Ввод кода проекта -->
                <div class="input-group input-group-sm d-none d-md-flex" style="width:280px;">
                    <input type="text" id="joinCode" class="form-control" placeholder="Код проекта (PRJ-XXXX)"
                        style="background-color: var(--bg-elevated); border-color: var(--border-color); color: white; text-transform:uppercase; letter-spacing:1px; font-family:monospace;">
                    <button class="btn btn-light fw-bold" id="joinProjectBtn">
                        <i class="bi bi-link-45deg"></i> ДОБАВИТЬ
                    </button>
                </div>
                <span class="text-white small d-none d-md-inline">
                    <i class="bi bi-person-fill"></i> <span id="userName">Загрузка...</span>
                </span>
                <a href="#" id="logoutBtn" class="btn btn-outline-light btn-sm fw-bold">ВЫЙТИ</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">

        <!-- Вкладки -->
        <ul class="nav nav-tabs mb-4" id="supplierTabs">
            <li class="nav-item">
                <button class="nav-link active fw-bold" data-bs-toggle="tab" data-bs-target="#tabProjects">
                    🏗 Мои проекты
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link fw-bold" id="requestsBtn" data-bs-toggle="tab" data-bs-target="#tabRequests">
                    📋 Заявки на материалы
                    <span class="badge bg-danger ms-1" id="requestsBadge" style="display:none;">0</span>
                </button>
            </li>
        </ul>

        <div class="tab-content">

            <!-- ВКЛАДКА: Проекты -->
            <div class="tab-pane fade show active" id="tabProjects">

                <!-- Мобильный ввод кода -->
                <div class="card shadow-sm mb-4 border-primary d-md-none">
                    <div class="card-body">
                        <h6 class="mb-2">🔗 Добавить проект по коду</h6>
                        <div class="d-flex gap-2">
                            <input type="text" id="joinCodeMobile" class="form-control" placeholder="PRJ-XXXX"
                                style="text-transform:uppercase;">
                            <button class="btn btn-primary fw-bold" id="joinProjectMobileBtn">OK</button>
                        </div>
                    </div>
                </div>

                <h4 class="mb-3">Мои проекты</h4>
                <div id="projectsList" class="row g-3">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary"></div>
                        <p class="mt-2 text-muted">Загрузка...</p>
                    </div>
                </div>
            </div>

            <!-- ВКЛАДКА: Заявки на материалы -->
            <div class="tab-pane fade" id="tabRequests">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">Заявки на материалы от прорабов</h4>
                    <small class="text-muted">Новые заявки требуют вашего ответа</small>
                </div>
                <div id="materialRequestsList">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка: детали проекта + материалы -->
    <div class="modal fade" id="projectModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="projectModalTitle">Проект</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="projectModalBody">
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка: добавить материал в проект -->
    <div class="modal fade" id="addMaterialModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">📦 Добавить материал</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="addMaterialForm">
                    <div class="modal-body">
                        <div class="alert alert-info small">
                            После добавления материал уйдёт прорабу на согласование
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Этап работ *</label>
                            <select class="form-select" id="mat_stage" required>
                                <option value="">Выберите этап...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Название материала *</label>
                            <input type="text" class="form-control" id="mat_name"
                                placeholder="Например: Кабель ВВГ 3х2.5" required>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Единица измерения</label>
                                <input type="text" class="form-control" id="mat_unit" placeholder="м, шт, кг...">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Количество *</label>
                                <input type="number" class="form-control" id="mat_qty" placeholder="0" step="0.1"
                                    min="0" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Стоимость (₽)</label>
                                <input type="number" class="form-control" id="mat_price" placeholder="0" min="0">
                            </div>
                        </div>
                        <div class="mb-3 mt-3">
                            <label class="form-label">Комментарий</label>
                            <textarea class="form-control" id="mat_notes" rows="2"
                                placeholder="Марка, ГОСТ, производитель..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-link text-muted text-decoration-none"
                            data-bs-dismiss="modal">Отмена</button>
                        <button type="submit" class="btn btn-success fw-bold px-4">
                            📨 Отправить на согласование
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/supplier.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Инициализация имени пользователя теперь в shared.js/api.js через checkAuth
            checkAuth();
        });

        async function joinProjectMobile() {
            document.getElementById('joinCode').value = document.getElementById('joinCodeMobile').value;
            await joinProject();
            document.getElementById('joinCodeMobile').value = '';
        }
        
        // Добавляем обработчики событий
        document.addEventListener('DOMContentLoaded', () => {
            const joinProjectBtn = document.getElementById('joinProjectBtn');
            if (joinProjectBtn) {
                joinProjectBtn.addEventListener('click', joinProject);
            }
            
            const joinProjectMobileBtn = document.getElementById('joinProjectMobileBtn');
            if (joinProjectMobileBtn) {
                joinProjectMobileBtn.addEventListener('click', joinProjectMobile);
            }
            
            const requestsBtn = document.getElementById('requestsBtn');
            if (requestsBtn) {
                requestsBtn.addEventListener('click', loadMaterialRequests);
            }
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('КЛИК ПО ВЫХОДУ!');
                    console.log('Начинаю процесс выхода...');
                    console.log('Текущий URL:', window.location.href);
                    
                    // Упрощенный выход без confirm для теста
                    console.log('Перенаправление на /login.html');
                    
                    // Пробуем разные способы
                    try {
                        window.location.href = '/login.html';
                        console.log('Способ 1: window.location.href выполнен');
                    } catch (e) {
                        console.log('Способ 1 не сработал:', e);
                    }
                    
                    // Запасной способ через 100мс
                    setTimeout(() => {
                        console.log('Запасной способ: window.location.replace');
                        window.location.replace('/login.html');
                    }, 100);
                });
                console.log('✅ Logout кнопка настроена в DOMContentLoaded');
            } else {
                console.log('❌ Logout кнопка не найдена в DOMContentLoaded');
            }
        });
        
        // ДОПОЛНИТЕЛЬНЫЙ ОБРАБОТЧИК ЧЕРЕЗ INTERVAL
        (function() {
            let attempts = 0;
            const maxAttempts = 10;
            
            function tryAddLogoutHandler() {
                const logoutBtn = document.getElementById('logoutBtn');
                if (logoutBtn && !logoutBtn.hasAttribute('data-logout-handler')) {
                    logoutBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        console.log('КЛИК ПО ВЫХОДУ (INTERVAL)!');
                        console.log('Начинаю процесс выхода...');
                        console.log('Текущий URL:', window.location.href);
                        
                        // Упрощенный выход без confirm для теста
                        console.log('Перенаправление на /login.html');
                        
                        // Пробуем разные способы
                        try {
                            window.location.href = '/login.html';
                            console.log('Способ 1: window.location.href выполнен');
                        } catch (e) {
                            console.log('Способ 1 не сработал:', e);
                        }
                        
                        // Запасной способ через 100мс
                        setTimeout(() => {
                            console.log('Запасной способ: window.location.replace');
                            window.location.replace('/login.html');
                        }, 100);
                    });
                    logoutBtn.setAttribute('data-logout-handler', 'true');
                    console.log('✅ Logout кнопка настроена через setInterval');
                    return true;
                }
                return false;
            }
            
            // Пробуем сразу
            if (tryAddLogoutHandler()) return;
            
            // Пробуем каждые 500мс
            const interval = setInterval(() => {
                attempts++;
                if (tryAddLogoutHandler() || attempts >= maxAttempts) {
                    clearInterval(interval);
                    if (attempts >= maxAttempts) {
                        console.log('❌ Не удалось найти logout кнопку за ' + maxAttempts + ' попыток');
                    }
                }
            }, 500);
        })();
        
        // САМЫЙ ПРОСТОЙ ОБРАБОТЧИК
        window.addEventListener('load', function() {
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn && !logoutBtn.hasAttribute('data-logout-handler')) {
                logoutBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('КЛИК ПО ВЫХОДУ (WINDOW.LOAD)!');
                    console.log('Перенаправление на /login.html');
                    window.location.href = '/login.html';
                });
                console.log('✅ Logout кнопка настроена через window.load');
            }
        });
    </script>
</body>

</html>

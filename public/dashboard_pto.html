<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Инженер ПТО | ЭнергоАтлант</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark bg-success mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">📑 ПТО (Документация)</span>
            <div class="d-flex align-items-center text-white">
                <span id="userName" class="me-3">...</span>
                <a href="/api/logout" class="btn btn-outline-light btn-sm">Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="card shadow-sm mb-4 border-success">
            <div class="card-body d-flex align-items-center justify-content-between">
                <div>
                    <h5 class="mb-1 text-success">🔗 Добавить проект</h5>
                    <p class="mb-0 text-muted small">Введите код проекта для загрузки ИД</p>
                </div>
                <div class="d-flex gap-2">
                    <input type="text" id="joinCode" class="form-control" placeholder="Код проекта">
                    <button class="btn btn-success" onclick="joinProject()">ОК</button>
                </div>
            </div>
        </div>

        <h4 class="mb-3">Проекты в работе</h4>
        <div id="projectsList" class="mb-4">
            <div class="p-4 text-center text-muted">Загрузка...</div>
        </div>
    </div>

    <!-- Модальное окно для просмотра проекта -->
    <div class="modal fade" id="projectModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title fw-bold">Детали проекта (ПТО)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="projectDetails">
                    <div class="text-center py-4">
                        <div class="spinner-border text-success"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Добавляем нужные скрипты -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/script.js"></script>
    <script src="/js/pto.js"></script>
</body>

</html>

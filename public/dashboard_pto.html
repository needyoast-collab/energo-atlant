<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Инженер ПТО | ЭнергоАтлант</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-success mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">📑 ПТО (Документация)</span>
            <div class="d-flex align-items-center text-white">
                <span id="userName" class="me-3">...</span>
                <a href="/api/logout" class="btn btn-outline-light btn-sm">Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm mb-4 border-success">
            <div class="card-body d-flex align-items-center justify-content-between">
                <div>
                    <h5 class="mb-1 text-success">🔗 Добавить проект</h5>
                    <p class="mb-0 text-muted small">Введите код проекта для загрузки ИД</p>
                </div>
                <div class="d-flex gap-2">
                    <input type="text" id="joinCode" class="form-control" placeholder="Код проекта">
                    <button class="btn btn-success" onclick="joinProject()">ОК</button>
                </div>
            </div>
        </div>

        <h4 class="mb-3">Проекты в работе</h4>
        <div id="projectsList" class="list-group shadow-sm">
            <div class="p-4 text-center">Загрузка...</div>
        </div>
    </div>

    <script>
        async function loadProjects() {
            const userRes = await fetch('/api/user/me');
            const userData = await userRes.json();
            if(userData.success) document.getElementById('userName').innerText = userData.user.name;

            const res = await fetch('/api/pto/projects');
            const data = await res.json();
            const list = document.getElementById('projectsList');
            
            if(!data.success || data.projects.length === 0) {
                list.innerHTML = '<div class="list-group-item">Нет проектов</div>';
                return;
            }

            list.innerHTML = data.projects.map(p => `
                <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-1">${p.title}</h5>
                        <small class="text-muted">${p.address}</small>
                    </div>
                    <span class="badge bg-secondary rounded-pill">Документов: 0</span>
                </a>
            `).join('');
        }

        async function joinProject() {
            const code = document.getElementById('joinCode').value;
            if(!code) return alert('Введите код');
            const res = await fetch('/api/pto/join', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({accessCode: code})
            });
            const data = await res.json();
            if(data.success) { alert('Добавлено!'); loadProjects(); }
            else alert(data.message);
        }
        loadProjects();
    </script>
</body>
</html>

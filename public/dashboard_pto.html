<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Инженер ПТО | ЭнергоАтлант</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4 shadow-sm"
        style="background-color: var(--bg-surface) !important; border-bottom: 1px solid var(--border-color);">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="/">
                <img src="/img/logo.png" alt="ЭнергоАтлант" style="height: 40px; object-fit: contain;" class="me-2">
                <span class="badge bg-success text-white ms-1 align-middle d-none d-sm-inline"
                    style="font-size: 0.75rem; letter-spacing: 1px; padding: 0.4em 0.6em;">ПТО</span>
            </a>

            <div class="d-flex align-items-center gap-3">
                <div class="input-group input-group-sm d-none d-md-flex" style="width:280px;">
                    <input type="text" id="joinCode" class="form-control" placeholder="КОД ПРОЕКТА"
                        style="background-color: var(--bg-elevated); border-color: var(--border-color); color: white; text-transform:uppercase; letter-spacing:1px; font-family:monospace;">
                    <button class="btn btn-success fw-bold" onclick="joinProject()">
                        <i class="bi bi-link-45deg"></i> ДОБАВИТЬ
                    </button>
                </div>
                <div class="d-flex align-items-center text-white small">
                    <i class="bi bi-person-circle me-2"></i>
                    <span id="userName" class="me-3">...</span>
                    <a href="#" onclick="event.preventDefault(); fetch('/api/logout', {method: 'POST'}).then(() => window.location.href = '/login.html');" class="btn btn-outline-light btn-sm fw-bold">ВЫЙТИ</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <h4 class="mb-4 text-white opacity-75">ОБЪЕКТЫ В РАБОТЕ</h4>
        <div id="projectsList" class="row g-4 mb-4">
            <div class="p-4 text-center text-muted">Загрузка проектов...</div>
        </div>
    </div>

    <!-- Модальное окно для просмотра проекта -->
    <div class="modal fade" id="projectModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title fw-bold">Детали проекта (ПТО)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="projectDetails">
                    <div class="text-center py-4">
                        <div class="spinner-border text-success"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Добавляем нужные скрипты -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/script.js"></script>
    <script src="/js/pto.js"></script>
</body>

</html>

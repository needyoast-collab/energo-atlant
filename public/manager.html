<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель | ЭнергоАтлант</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --accent: #ff9800;
            --text: #c9d1d9;
            --border: #30363d;
            --success: #238636;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
        }
        /* Сайдбар */
        .sidebar {
            width: 260px;
            background: var(--card);
            height: 100vh;
            border-right: 1px solid var(--border);
            padding: 20px;
            position: fixed;
            top: 0; left: 0;
            overflow-y: auto;
        }
        .sidebar h2 { color: var(--accent); font-size: 1.2rem; margin-bottom: 30px; }
        .sidebar a {
            display: block;
            color: var(--text);
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 5px;
            transition: 0.2s;
        }
        .sidebar a:hover { background: rgba(255,255,255,0.05); }
        .sidebar a.active { background: var(--accent); color: white; }
        
        /* Контент */
        .main {
            margin-left: 300px;
            padding: 40px;
            width: 100%;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }
        h3 { margin-top: 0; color: white; border-bottom: 1px solid var(--border); padding-bottom: 15px; }

        /* Элементы форм */
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #0d1117;
            border: 1px solid var(--border);
            color: white;
            border-radius: 6px;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
            outline: none;
        }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #8b949e; }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn:hover { opacity: 0.9; }
        .btn-del { background: none; border: 1px solid #f85149; color: #f85149; padding: 5px 10px; font-size: 0.85rem; }
        .btn-del:hover { background: #f85149; color: white; }

        /* Таблицы */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: #8b949e; padding: 10px; font-size: 0.9rem; }
        td { padding: 12px 10px; border-top: 1px solid var(--border); }
        
        /* Генератор */
        .code-display {
            font-family: monospace;
            font-size: 1.4rem;
            color: var(--success);
            background: rgba(35, 134, 54, 0.1);
            padding: 10px;
            border-radius: 6px;
            display: inline-block;
            margin-right: 15px;
            border: 1px dashed var(--success);
        }

        /* Сетка для формы проекта */
        .project-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .full-width { grid-column: span 2; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>ЭНЕРГО<span>АТЛАНТ</span></h2>
        <nav>
            <a href="#" class="active"><i class="fas fa-tools"></i> Управление</a>
            <a href="cabinet.html"><i class="fas fa-chart-pie"></i> Мой Кабинет</a>
            <a href="#" id="logoutBtn" style="color: #f85149; margin-top: 50px;"><i class="fas fa-sign-out-alt"></i> Выйти</a>
        </nav>
    </aside>

    <main class="main">
        <h1>Панель Менеджера</h1>

        <div class="card">
            <h3><i class="fas fa-key"></i> Приглашения</h3>
            <div style="display: flex; align-items: center;">
                <div id="codeDisplay" class="code-display">----</div>
                <button class="btn" id="generateCodeBtn"><i class="fas fa-sync-alt"></i> Создать код</button>
            </div>
            <p style="margin-top: 10px; font-size: 0.9rem; color: #8b949e;">Отправьте этот код клиенту для регистрации.</p>
        </div>

        <div class="card">
            <h3><i class="fas fa-hard-hat"></i> Создать новый объект</h3>
            <form id="createProjectForm">
                <div class="project-form-grid">
                    <div>
                        <label>Название объекта *</label>
                        <input type="text" id="p-title" placeholder="Напр: ПС Северная-2" required>
                    </div>
                    <div>
                        <label>Адрес объекта *</label>
                        <input type="text" id="p-address" placeholder="г. Москва, ул..." required>
                    </div>
                    <div>
                        <label>Тип работ *</label>
                        <input type="text" id="p-work-type" placeholder="Напр: Строительство, Ремонт..." required>
                    </div>
                    <div>
                        <label>Протяжённость *</label>
                        <input type="text" id="p-length" placeholder="Напр: 100м, 5км..." required>
                    </div>
                    <div class="full-width">
                        <label>Клиент (Владелец)</label>
                        <select id="p-user">
                            <option value="">Выберите клиента...</option>
                        </select>
                    </div>
                    <div class="full-width">
                        <label>Описание работ</label>
                        <textarea id="p-desc" rows="2" placeholder="Краткое описание задачи..."></textarea>
                    </div>
                </div>
                <button type="submit" class="btn"><i class="fas fa-plus"></i> Запустить в работу</button>
            </form>
        </div>

        <div class="card">
            <h3><i class="fas fa-list"></i> Активные проекты</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Клиент</th>
                        <th>Статус</th>
                        <th>Прогресс</th>
                        <th>Управление</th>
                    </tr>
                </thead>
                <tbody id="projectsList">
                    </tbody>
            </table>
        </div>

        <div class="card">
            <h3><i class="fas fa-users"></i> База клиентов</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Логин</th>
                        <th>Контакты</th>
                        <th>Роль</th>
                        <th>Удалить</th>
                    </tr>
                </thead>
                <tbody id="usersList">
                    </tbody>
            </table>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        // --- 1. ГЕНЕРАТОР ---
        async function generateNewCode() {
            const res = await fetch('/api/admin/generate-code');
            const data = await res.json();
            if(data.success) document.getElementById('codeDisplay').innerText = data.code;
        }

        // --- 2. ЗАГРУЗКА ДАННЫХ ---
        async function loadAll() {
            loadUsers();
            loadProjects();
        }

        async function loadUsers() {
            const res = await fetch('/api/admin/users');
            const data = await res.json();
            if(!data.success) return;

            // Заполняем таблицу пользователей
            const userTable = document.getElementById('usersList');
            userTable.innerHTML = data.users.map(u => `
                <tr>
                    <td>${u.id}</td>
                    <td><b>${u.login}</b></td>
                    <td>${u.email}<br><small>${u.phone}</small></td>
                    <td>${u.role}</td>
                    <td>${u.role !== 'admin' ? `<button class="btn-del" data-id="${u.id}">Удалить</button>` : '-'}</td>
                </tr>
            `).join('');

            // Заполняем выпадающий список (SELECT) в форме проекта
            const select = document.getElementById('p-user');
            select.innerHTML = '<option value="">Выберите клиента...</option>' + 
                data.users
                    .filter(u => u.role !== 'admin') // Админам проекты не назначаем
                    .map(u => `<option value="${u.id}">${u.login} (${u.email})</option>`)
                    .join('');
        }

        async function loadProjects() {
            const res = await fetch('/api/projects');
            const data = await res.json();
            if(!data.success) return;

            const table = document.getElementById('projectsList');
            if(data.projects.length === 0) {
                table.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px;">Проектов пока нет</td></tr>';
                return;
            }

            table.innerHTML = data.projects.map(p => `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.title}<br><small style="color:#8b949e">${p.address}</small></td>
                    <td><span style="color:var(--accent)">${p.owner_name}</span></td>
                    <td>${p.status}</td>
                    <td>
                        <div style="background:#30363d; height:6px; width:100px; border-radius:3px;">
                            <div style="background:var(--success); height:100%; width:${p.progress}%"></div>
                        </div>
                        <small>${p.progress}%</small>
                    </td>
                    <td><button class="btn-del" data-id="${p.id}"><i class="fas fa-trash"></i></button></td>
                </tr>
            `).join('');
        }

        // --- 3. ДЕЙСТВИЯ ---
        async function createProject(e) {
            e.preventDefault();
            const title = document.getElementById('p-title').value;
            const address = document.getElementById('p-address').value;
            const workType = document.getElementById('p-work-type').value;
            const length = document.getElementById('p-length').value;
            const user_id = document.getElementById('p-user').value;
            const description = document.getElementById('p-desc').value;

            console.log('Валидация формы проекта:');
            console.log('title:', title);
            console.log('address:', address);
            console.log('workType:', workType);
            console.log('length:', length);

            // Проверка 4 обязательных полей (минимум 1 символ)
            if(!title || title.trim().length < 1) {
                alert("Введите название объекта (минимум 1 символ)!");
                document.getElementById('p-title').focus();
                return;
            }

            if(!address || address.trim().length < 1) {
                alert("Введите адрес объекта (минимум 1 символ)!");
                document.getElementById('p-address').focus();
                return;
            }

            if(!workType || workType.trim().length < 1) {
                alert("Введите тип работ (минимум 1 символ)!");
                document.getElementById('p-work-type').focus();
                return;
            }

            if(!length || length.trim().length < 1) {
                alert("Введите протяжённость (минимум 1 символ)!");
                document.getElementById('p-length').focus();
                return;
            }

            console.log('Валидация пройдена, отправка данных...');

            // Используем apiRequest как в manager.js
            const projectData = {
                title: title,
                address: address,
                work_type: workType,
                length_m: length
            };
            
            if (user_id) projectData.user_id = user_id;
            if (description) projectData.description = description;
            
            console.log('=== ПОЛНАЯ ДИАГНОСТИКА ЗАПРОСА ===');
            console.log('1. Данные для отправки:', JSON.stringify(projectData, null, 2));
            console.log('2. URL: /api/manager/projects');
            console.log('3. Method: POST');
            console.log('4. Content-Type: application/json');
            console.log('5. Проверяем apiRequest функцию:', typeof apiRequest);
            
            // Пробуем прямой fetch для сравнения
            console.log('=== ТЕСТ ПРЯМОГО FETCH ===');
            try {
                const directResponse = await fetch('/api/manager/projects', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(projectData)
                });
                
                console.log('Прямой fetch статус:', directResponse.status);
                console.log('Прямой fetch.statusText:', directResponse.statusText);
                
                const directText = await directResponse.text();
                console.log('Прямой fetch ответ (текст):', directText);
                
                if (directResponse.ok) {
                    console.log('✅ Прямой fetch сработал!');
                    alert('✅ Проект создан через прямой fetch!');
                    e.target.reset();
                    loadProjects();
                    return;
                } else {
                    console.log('❌ Прямой fetch тоже не сработал');
                }
            } catch (e) {
                console.log('Ошибка прямого fetch:', e);
            }
            
            console.log('=== ПРОБУЕМ APIREQUEST ===');
            const res = await apiRequest('/api/manager/projects', 'POST', projectData);
            
            console.log('=== ДЕТАЛЬНЫЙ ОТВЕТ API ===');
            console.log('Полный ответ apiRequest:', JSON.stringify(res, null, 2));
            console.log('success:', res.success);
            console.log('message:', res.message);
            console.log('errors:', res.errors);
            console.log('data:', res.data);
            
            // apiRequest возвращает объект с полями success, data, message
            if(res.success) {
                console.log('✅ Проект успешно создан!');
                console.log('Данные проекта:', res.data);
                
                // Очистка формы и обновление таблицы
                e.target.reset();
                loadProjects();
                
                alert('✅ Проект успешно создан!');
            } else {
                console.log('❌ Ошибка создания проекта:');
                console.log('Сообщение:', res.message);
                console.log('Ошибки:', res.errors);
                
                let errorMsg = res.message || 'Неизвестная ошибка';
                if (res.errors && Object.keys(res.errors).length > 0) {
                    errorMsg += '\nДетали:\n' + Object.entries(res.errors)
                        .map(([field, messages]) => `${field}: ${Array.isArray(messages) ? messages.join(', ') : messages}`)
                        .join('\n');
                }
                
                alert("❌ Ошибка при создании проекта:\n" + errorMsg);
            }
        }

        async function deleteUser(id) {
            if(confirm('Удалить пользователя?')) {
                await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
                loadAll();
            }
        }

        async function deleteProject(id) {
            if(confirm('Удалить этот проект?')) {
                await fetch(`/api/projects/${id}`, { method: 'DELETE' });
                loadProjects();
            }
        }

        // Старт
        loadAll();
        
        // Добавляем обработчики событий
        document.addEventListener('DOMContentLoaded', () => {
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('КЛИК ПО ВЫХОДУ!');
                    console.log('Начинаю процесс выхода...');
                    console.log('Текущий URL:', window.location.href);
                    
                    // Упрощенный выход без confirm для теста
                    console.log('Перенаправление на /login.html');
                    
                    // Пробуем разные способы
                    try {
                        window.location.href = '/login.html';
                        console.log('Способ 1: window.location.href выполнен');
                    } catch (e) {
                        console.log('Способ 1 не сработал:', e);
                    }
                    
                    // Запасной способ через 100мс
                    setTimeout(() => {
                        console.log('Запасной способ: window.location.replace');
                        window.location.replace('/login.html');
                    }, 100);
                });
                console.log('✅ Logout кнопка настроена в DOMContentLoaded');
            } else {
                console.log('❌ Logout кнопка не найдена в DOMContentLoaded');
            }
        });
        
        // ДОПОЛНИТЕЛЬНЫЙ ОБРАБОТЧИК ЧЕРЕЗ INTERVAL
        (function() {
            let attempts = 0;
            const maxAttempts = 10;
            
            function tryAddLogoutHandler() {
                const logoutBtn = document.getElementById('logoutBtn');
                if (logoutBtn && !logoutBtn.hasAttribute('data-logout-handler')) {
                    logoutBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        console.log('КЛИК ПО ВЫХОДУ (INTERVAL)!');
                        console.log('Начинаю процесс выхода...');
                        console.log('Текущий URL:', window.location.href);
                        
                        // Упрощенный выход без confirm для теста
                        console.log('Перенаправление на /login.html');
                        
                        // Пробуем разные способы
                        try {
                            window.location.href = '/login.html';
                            console.log('Способ 1: window.location.href выполнен');
                        } catch (e) {
                            console.log('Способ 1 не сработал:', e);
                        }
                        
                        // Запасной способ через 100мс
                        setTimeout(() => {
                            console.log('Запасной способ: window.location.replace');
                            window.location.replace('/login.html');
                        }, 100);
                    });
                    logoutBtn.setAttribute('data-logout-handler', 'true');
                    console.log('✅ Logout кнопка настроена через setInterval');
                    return true;
                }
                return false;
            }
            
            // Пробуем сразу
            if (tryAddLogoutHandler()) return;
            
            // Пробуем каждые 500мс
            const interval = setInterval(() => {
                attempts++;
                if (tryAddLogoutHandler() || attempts >= maxAttempts) {
                    clearInterval(interval);
                    if (attempts >= maxAttempts) {
                        console.log('❌ Не удалось найти logout кнопку за ' + maxAttempts + ' попыток');
                    }
                }
            }, 500);
        })();
        
        // САМЫЙ ПРОСТОЙ ОБРАБОТЧИК
        window.addEventListener('load', function() {
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn && !logoutBtn.hasAttribute('data-logout-handler')) {
                logoutBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('КЛИК ПО ВЫХОДУ (WINDOW.LOAD)!');
                    console.log('Перенаправление на /login.html');
                    window.location.href = '/login.html';
                });
                console.log('✅ Logout кнопка настроена через window.load');
            }
        });
        
        // Другие обработчики
        document.addEventListener('DOMContentLoaded', () => {
            const generateCodeBtn = document.getElementById('generateCodeBtn');
            if (generateCodeBtn) {
                generateCodeBtn.addEventListener('click', generateNewCode);
            }
            
            const createProjectForm = document.getElementById('createProjectForm');
            if (createProjectForm) {
                createProjectForm.addEventListener('submit', createProject);
            }
            
            // Делегированный обработчик для кнопок удаления
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('btn-del')) {
                    const id = parseInt(e.target.dataset.id);
                    if (id) {
                        if (e.target.textContent.includes('Удалить')) {
                            deleteUser(id);
                        } else {
                            deleteProject(id);
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>

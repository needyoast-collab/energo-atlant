<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет заказчика - ЭнергоАтлант</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">⚡ ЭнергоАтлант</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <span class="navbar-text text-white me-3">
                            <span id="userName"></span> 
                            <small class="text-white-50">(<span id="userRole"></span>)</small>
                        </span>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light" id="logoutBtn">Выход</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2">👤 Личный кабинет</h1>
            <div>
                <button class="btn btn-primary me-2" onclick="showCreateRequestModal()">
                    📝 Создать заявку
                </button>
                <button class="btn btn-success" onclick="showJoinProjectModal()">
                    🔑 Ввести код проекта
                </button>
            </div>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="projects-tab" data-bs-toggle="tab" data-bs-target="#projectsTab" type="button">
                    📋 Мои проекты
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="details-tab" data-bs-toggle="tab" data-bs-target="#detailsTab" type="button">
                    🔍 Детали проекта
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="requests-tab" data-bs-toggle="tab" data-bs-target="#requestsTab" type="button">
                    📬 Мои заявки
                </button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <!-- Проекты -->
            <div class="tab-pane fade show active" id="projectsTab" role="tabpanel">
                <div id="projectsList">
                    <div class="text-center p-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Загрузка...</span>
                        </div>
                        <p class="mt-2 text-muted">Загрузка проектов...</p>
                    </div>
                </div>
            </div>

            <!-- Детали проекта -->
            <div class="tab-pane fade" id="detailsTab" role="tabpanel">
                <div id="projectDetails">
                    <div class="alert alert-info">
                        👈 Выберите проект из списка, чтобы увидеть детали и прогресс работ
                    </div>
                </div>
            </div>

            <!-- Заявки -->
            <div class="tab-pane fade" id="requestsTab" role="tabpanel">
                <div id="requestsStatus">
                    <div class="text-center p-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Загрузка...</span>
                        </div>
                        <p class="mt-2 text-muted">Загрузка заявок...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/customer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет заказчика - ЭнергоАтлант</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">⚡ ЭнергоАтлант</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3">
                        <span class="text-white">
                            <i class="bi bi-person-circle"></i> <span id="userName">Загрузка...</span>
                        </span>
                    </li>
                    <li class="nav-item">
                        <a href="/api/logout" class="btn btn-danger btn-sm text-white fw-bold">
                            Выйти
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        
 <div class="mb-3">
    <label class="form-label">Контактный телефон *</label>
    <input type="tel" class="form-control" id="requestContact" 
           placeholder="+79991234567"
           pattern="^[\\+]?[78][-\\s\\(]?\\d{3}[-\\s\\)]?\\d{3}[-\\s]?\\d{2}[-\\s]?\\d{2}$"
           required>
    <small class="text-muted">Формат: +79991234567 или 89991234567</small>
    <div class="invalid-feedback">
        Введите корректный номер телефона
    </div>
</div>

        <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" id="projects-tab" data-bs-toggle="tab" data-bs-target="#projectsTab" type="button">
                    🏗 Мои проекты
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="requests-tab" data-bs-toggle="tab" data-bs-target="#requestsTab" type="button">
                    📬 История заявок
                </button>
            </li>
        </ul>

        <div class="tab-content bg-white p-4 rounded shadow-sm border" id="myTabContent">
            
            <div class="tab-pane fade show active" id="projectsTab" role="tabpanel">
                <div id="projectsList" class="row g-3">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 text-muted">Загружаем ваши проекты...</p>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="requestsTab" role="tabpanel">
                <div id="requestsStatus">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 text-muted">Проверяем историю заявок...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/customer.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/user/me');
                const data = await res.json();
                if(data.success) {
                    document.getElementById('userName').innerText = data.user.name || data.user.login;
                }
            } catch (e) { console.error(e); }
        });
    </script>
</body>
</html>

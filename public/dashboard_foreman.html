<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет Прораба - ЭнергоАтлант</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">⚡ ЭнергоАтлант <span class="badge bg-warning text-dark ms-2">Прораб</span></a>
            
            <div class="d-flex align-items-center">
                <span class="text-white me-3 d-none d-md-inline">
                    <i class="bi bi-helmet"></i> <span id="userName">...</span>
                </span>
                <a href="/api/logout" class="btn btn-outline-light btn-sm fw-bold">Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container">
        
        <div class="card shadow-sm mb-4 border-warning">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-1 fw-bold">👷 Новый объект?</h5>
                    <p class="mb-0 text-muted small">Введите код проекта, если вас еще не назначили</p>
                </div>
                <div class="d-flex gap-2">
                    <input type="text" id="joinCode" class="form-control" placeholder="Например: PRJ-1234">
                    <button class="btn btn-warning fw-bold" onclick="joinProject()">Добавить</button>
                </div>
            </div>
        </div>

        <h3 class="mb-3">Мои объекты</h3>
        
        <div id="projectsList" class="row g-3">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-warning"></div>
                <p class="mt-2 text-muted">Загружаем список объектов...</p>
            </div>
        </div>
    </div>

    <div class="modal fade" id="projectModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title fw-bold text-dark" id="modalTitle">Название объекта</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul class="nav nav-pills mb-3 justify-content-center" id="pills-tab">
                        <li class="nav-item">
                            <button class="nav-link active fw-bold text-dark" data-bs-target="#tab-stages" data-bs-toggle="pill">🛠 Работы (Этапы)</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link fw-bold text-dark" data-bs-target="#tab-materials" data-bs-toggle="pill">📦 Материалы</button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="tab-stages">
                            <div id="stagesContent">Загрузка этапов...</div>
                        </div>
                        <div class="tab-pane fade" id="tab-materials">
                            <div id="materialsContent">Загрузка материалов...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/foreman.js"></script>

    <script>
        // Инициализация
        document.addEventListener('DOMContentLoaded', async () => {
            const userRes = await fetch('/api/user/me');
            const userData = await userRes.json();
            if(userData.success) document.getElementById('userName').innerText = userData.user.name;
            
            // Загрузка проектов (если foreman.js подключен и имеет функцию loadProjects)
            if(typeof loadProjects === 'function') loadProjects();
        });

        // Функция присоединения (дублируем тут для надежности)
        async function joinProject() {
            const code = document.getElementById('joinCode').value;
            if(!code) return alert('Введите код');
            
            const res = await fetch('/api/foreman/join', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({accessCode: code})
            });
            const data = await res.json();
            if(data.success) { alert('✅ Вы добавлены в проект!'); location.reload(); }
            else alert('❌ Ошибка: ' + data.message);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет Прораба - ЭнергоАтлант</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="/">
                <img src="/img/logo.png" alt="ЭнергоАтлант" style="height: 40px; object-fit: contain;" class="me-2">
                <span class="badge bg-warning text-dark ms-1 align-middle d-none d-sm-inline"
                    style="font-size: 0.75rem; letter-spacing: 1px; padding: 0.4em 0.6em;">ПРОРАБ</span>
            </a>

            <div class="d-flex align-items-center gap-2">
                <!-- Ввод кода проекта прямо в navbar -->
                <div class="input-group input-group-sm d-none d-md-flex" style="width:260px;">
                    <input type="text" id="joinCode" class="form-control" placeholder="Код проекта (PRJ-XXXX)"
                        style="background-color: var(--bg-elevated); border-color: var(--border-color); color: white; text-transform:uppercase; letter-spacing:1px;">
                    <button class="btn btn-warning fw-bold" onclick="joinProject()">
                        <i class="bi bi-link-45deg"></i> ДОБАВИТЬ
                    </button>
                </div>
                <span class="text-white me-2 d-none d-md-inline small">
                    <i class="bi bi-person-fill"></i> <span id="userName">...</span>
                </span>
                <a href="#"
                    onclick="event.preventDefault(); fetch('/api/logout', {method: 'POST'}).then(() => window.location.href = '/login.html');"
                    class="btn btn-outline-light btn-sm fw-bold">ВЫЙТИ</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">

        <!-- Главный переключатель: Этапы / Материалы -->
        <ul class="nav nav-tabs mb-4" id="foremanTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" id="tab-projects-btn" data-bs-toggle="tab"
                    data-bs-target="#tabProjects" type="button">
                    🛠 Этапы работ
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="tab-materials-btn" data-bs-toggle="tab"
                    data-bs-target="#tabMaterials" type="button" onclick="loadAllMaterials()">
                    📦 Материалы
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="tab-approvals-btn" data-bs-toggle="tab"
                    data-bs-target="#tabApprovals" type="button" onclick="loadMaterialApprovals()">
                    ✅ Согласование
                    <span class="badge bg-danger ms-1" id="approvalsBadge" style="display:none;">0</span>
                </button>
            </li>
        </ul>

        <div class="tab-content">

            <!-- ===== ВКЛАДКА ЭТАПЫ РАБОТ ===== -->
            <div class="tab-pane fade show active" id="tabProjects" role="tabpanel">

                <!-- Ввод кода на мобильных -->
                <div class="card shadow-sm mb-4 border-warning d-md-none">
                    <div class="card-body">
                        <h6 class="mb-2">👷 Добавить объект по коду</h6>
                        <div class="d-flex gap-2">
                            <input type="text" id="joinCodeMobile" class="form-control" placeholder="PRJ-XXXX"
                                style="text-transform:uppercase;">
                            <button class="btn btn-warning fw-bold" onclick="joinProjectMobile()">OK</button>
                        </div>
                    </div>
                </div>

                <h4 class="mb-3">Мои объекты</h4>
                <div id="projectsList" class="row g-3">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-warning"></div>
                        <p class="mt-2 text-muted">Загружаем список объектов...</p>
                    </div>
                </div>
            </div>

            <!-- ===== ВКЛАДКА МАТЕРИАЛЫ ===== -->
            <div class="tab-pane fade" id="tabMaterials" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">Материалы по всем объектам</h4>
                    <small class="text-muted">
                        <i class="bi bi-info-circle"></i>
                        Расход можно вводить только в пределах полученного на склад
                    </small>
                </div>

                <div id="materialsContainer">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary"></div>
                        <p class="mt-2 text-muted">Загрузка материалов...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== ВКЛАДКА СОГЛАСОВАНИЕ ===== -->
        <div class="tab-pane fade" id="tabApprovals" role="tabpanel">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">Материалы от снабженца — ожидают согласования</h4>
            </div>
            <div id="approvalsContainer">
                <div class="text-center py-4">
                    <div class="spinner-border text-warning"></div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- Модальное окно деталей проекта -->
    <div class="modal fade" id="projectModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title fw-bold text-white" id="modalTitle">Объект</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody">
                    <div class="text-center py-4">
                        <div class="spinner-border text-warning"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/foreman.js"></script>
    <!-- foreman.js обрабатывает обе вкладки: Этапы работ и Материалы -->

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Инициализация имени пользователя теперь в shared.js/api.js через checkAuth
            checkAuth();
        });

        // Мобильный ввод кода
        async function joinProjectMobile() {
            document.getElementById('joinCode').value = document.getElementById('joinCodeMobile').value;
            await joinProject();
            document.getElementById('joinCodeMobile').value = '';
        }
    </script>
</body>

</html>
